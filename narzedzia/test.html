<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Obecności WSB</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: 40px auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); box-sizing: border-box; }
        h2 { margin-top: 0; color: #002d62; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; text-align: center; }
        label { display: block; margin: 12px 0 5px; font-weight: bold; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #0056b3; border: none; color: white; font-size: 16px; border-radius: 6px; margin-top: 20px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #003d82; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-weight: bold; font-size: 14px; display: none; }
        .success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }
        .info-box { background: #e0f2fe; color: #0369a1; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .loader { display: none; text-align: center; margin-top: 10px; font-size: 14px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Rejestracja Obecności</h2>
        <div class="info-box">Wprowadź swoje dane, aby zapisać się na zajęcia</div>

        <div id="alertBox" class="alert"></div>

        <form id="attendanceForm">
            <label for="indeks">Numer indeksu:</label>
            <input type="text" id="indeks" placeholder="np. 12345" required>

            <label for="imie">Imię:</label>
            <input type="text" id="imie" placeholder="Wpisz imię" required>

            <label for="nazwisko">Nazwisko:</label>
            <input type="text" id="nazwisko" placeholder="Wpisz nazwisko" required>

            <label for="feedback">Feedback z dzisiejszych zajęć (opcjonalnie):</label>
            <textarea id="feedback" rows="3" placeholder="Co było ciekawe, a co warto poprawić?"></textarea>

            <button type="submit" id="submitBtn">Zapisz moją obecność</button>
            <div id="loader" class="loader">Trwa przetwarzanie... Proszę czekać.</div>
        </form>
    </div>
</div>

<script>
// =================================================================
// KONFIGURACJA – TUTAJ WPISZ SWOJE STAŁE DANE Z MOODLE
// =================================================================
const MOODLE_URL = 'https://moodle2.e-wsb.pl';
const TOKEN      = '86f5f61f69875fc0a07c7bc91ce15675';

// UWAGA: Przed każdym wykładem musisz zmienić TYLKO tę jedną liczbę poniżej 
// na aktualne ID sesji (pobrane z Moodle z paska adresu):
const SESSION_ID = 12345; 

// OPCJONALNIE: Jeśli chcesz zbierać feedback do Google Sheets, utwórz zwykły 
// Formularz Google z polami (Indeks, Imię, Nazwisko, Feedback) i wklej tu link do wysyłki (formResponse)
const GOOGLE_FORM_URL = ''; 
// =================================================================

document.getElementById('attendanceForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const indeks = document.getElementById('indeks').value.trim();
    const imie = document.getElementById('imie').value.trim();
    const nazwisko = document.getElementById('nazwisko').value.trim();
    const feedback = document.getElementById('feedback').value.trim();
    
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    const loader = document.getElementById('loader');
    
    // Reset widoku
    alertBox.className = 'alert';
    alertBox.style.display = 'none';
    submitBtn.disabled = true;
    loader.style.display = 'block';

    try {
        // KROK 1: Szukanie ID użytkownika w Moodle po numerze indeksu (idnumber)
        const searchUrl = `${MOODLE_URL}/webservice/rest/server.php?wstoken=${TOKEN}&wsfunction=core_user_get_users_by_field&moodleformat=json&field=idnumber&values[0]=${encodeURIComponent(indeks)}`;
        
        const searchResponse = await fetch(searchUrl);
        const searchData = await searchResponse.json();

        if (searchData.exception) {
            throw new Error(`Błąd Moodle (API): ${searchData.message}`);
        }

        if (!searchData || searchData.length === 0) {
            throw new Error(`Nie znaleziono w Moodle studenta o indeksie: ${indeks}`);
        }

        const moodleUserId = searchData[0].id;

        // KROK 2: Wpisanie obecności do Moodle (mod_attendance_update_user_status)
        const attendanceUrl = `${MOODLE_URL}/webservice/rest/server.php`;
        
        // Budujemy parametry do wysyłki POST
        const formData = new URLSearchParams();
        formData.append('wstoken', TOKEN);
        formData.append('wsfunction', 'mod_attendance_update_user_status');
        formData.append('moodleformat', 'json');
        formData.append('sessionid', SESSION_ID);
        formData.append('studentid', moodleUserId);
        formData.append('status', 'P'); // P = Present (Obecny)

        const attendanceResponse = await fetch(attendanceUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        });
        
        const attendanceData = await attendanceResponse.json();

        if (attendanceData.exception) {
            throw new Error(`Moodle odnalazł Cię, ale nie mógł zapisać obecności: ${attendanceData.message}`);
        }

        // KROK 3: Opcjonalny zapis feedbacku do Google Forms (jeśli skonfigurowano)
        if (GOOGLE_FORM_URL) {
            // W tle wysyłamy dane do formularza Google (Google automatycznie zapisze to w Excelu/Sheets)
            const googleFormData = new FormData();
            // Tutaj w prawdziwym wdrożeniu dopasowuje się tzw. entry.XXXXX ze struktury Formularza Google
            googleFormData.append('entry.111111111', indeks);
            googleFormData.append('entry.222222222', `${imie} ${nazwisko}`);
            googleFormData.append('entry.333333333', feedback);
            
            fetch(GOOGLE_FORM_URL, { method: 'POST', mode: 'no-cors', body: googleFormData }).catch(e => console.log(e));
        }

        // Sukces!
        alertBox.textContent = "Status: Obecność została zarejestrowana pomyślnie w Moodle. Dziękujemy!";
        alertBox.classList.add('success');
        document.getElementById('attendanceForm').reset();

    } catch (error) {
        alertBox.textContent = error.message;
        alertBox.classList.add('error');
    } finally {
        submitBtn.disabled = false;
        loader.style.display = 'none';
    }
});
</script>

</body>
</html>
