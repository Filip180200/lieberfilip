<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dixit: 84 Karty + Edycja</title>

    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="images/logo.png" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        #squares-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background-color: #111; pointer-events: none;
        }

        :root {
            --card-width: 200px;
            --card-height: 300px;
            --accent-color: #e67e22;
            --select-color: #2ecc71;
            --remove-color: #e74c3c;
            --zoom-color: #3498db;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: transparent;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 100px 20px 40px;
        }

        h1 {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            text-align: center;
        }

        /* Panel sterowania (warianty glass-effect: te same wartości blur/border/shadow) */
        .controls {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            border-radius: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.4);
        }

        button {
            background-color: var(--accent-color);
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        button.mode-select {
            background-color: #3498db;
        }

        button.confirm-btn {
            background-color: var(--select-color);
            display: none;
        }
        
        button.reset {
            background-color: #7f8c8d;
        }

        /* Kontener na karty */
        .board {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
            padding-bottom: 50px;
        }

        /* Stylizacja karty (wspólna) - warianty glass-effect: te same wartości border/shadow */
        .card {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.4);
            position: relative;
            background-color: #fff;
            transition: transform 0.2s, border 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-number {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
        }

        /* --- TRYB DUŻY (WYŚWIETLANIE) --- */
        .board:not(.selection-mode) .card {
            width: var(--card-width);
            height: var(--card-height);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Przycisk akcji (wspólny styl dla X i Lupki) */
        .action-btn {
            position: absolute;
            top: 5px;
            width: 30px;
            height: 30px;
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            z-index: 50;
            opacity: 0.8;
            transition: opacity 0.2s, transform 0.2s;
            color: white;
        }

        .action-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* Przycisk usuwania (prawa strona) */
        .remove-btn {
            right: 5px;
            background-color: var(--remove-color);
        }

        /* Przycisk powiększania (lewa strona) */
        .zoom-btn {
            left: 5px;
            background-color: var(--zoom-color);
        }

        /* --- TRYB SELEKCJI (SIATKA) --- */
        .board.selection-mode {
            gap: 8px;
        }

        .board.selection-mode .card {
            width: 80px;  
            height: 120px;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.7;
        }
        
        .board.selection-mode .card:hover {
            transform: scale(1.05);
            opacity: 1;
            z-index: 10;
        }

        .board.selection-mode .card.selected {
            border-color: var(--select-color);
            transform: scale(1.1);
            opacity: 1;
            box-shadow: 0 0 10px var(--select-color);
            z-index: 20;
        }

        .board.selection-mode .card.selected::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
            color: var(--select-color);
            text-shadow: 0 0 3px black;
            font-weight: bold;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .status-bar {
            margin-bottom: 15px;
            font-size: 1.1em;
            min-height: 1.5em;
            text-align: center;
        }

        /* --- MODAL (PEŁNY EKRAN) --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeIn 0.3s;
        }

        .modal-content {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-close {
            margin-top: 15px;
            background: transparent;
            border: 2px solid white;
            color: white;
            font-size: 18px;
            padding: 8px 24px;
            border-radius: 30px;
        }
        
        .modal-close:hover {
            background: white;
            color: black;
            transform: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="squares-canvas"></canvas>

    <header>
        <div class="pill-nav-container">
            <nav class="pill-nav">
                <a href="index.html" class="pill-logo glass-effect">
                    <img src="images/logo.png" alt="Logo" />
                </a>
                <div class="pill-nav-items">
                    <ul class="pill-list">
                        <li><a href="zajecia.html" class="pill glass-effect"><span class="hover-circle"></span><span class="label-stack"><span class="pill-label">Zajęcia</span><span class="pill-label-hover">Zajęcia</span></span></a></li>
                    </ul>
                </div>
                <button class="mobile-menu-button glass-effect"><span class="hamburger-line"></span><span class="hamburger-line"></span></button>
                <div class="mobile-menu-popover">
                    <ul class="mobile-menu-list">
                        <li><a href="zajecia.html" class="mobile-menu-link">Zajęcia</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <h1>🐰 Dixit: Talia 84 Kart</h1>

    <div class="status-bar" id="status">Wybierz tryb poniżej</div>

    <div class="controls">
        <button onclick="drawRandom(1)">🎲 Losuj 1</button>
        <button onclick="drawRandom(3)">🎲 Losuj 3</button>
        
        <button class="mode-select" onclick="showSelectionMode()">🔍 Przeglądaj (84)</button>

        <button id="confirmBtn" class="confirm-btn" onclick="showSelectedCards()">✅ Pokaż wybrane</button>
        
        <button class="reset" onclick="resetBoard()">🗑️ Wyczyść stół</button>
    </div>

    <div class="board" id="board">
        <!-- Tutaj pojawią się karty -->
    </div>

    <!-- Modal do pełnego ekranu -->
    <div id="modal" class="modal-overlay" onclick="closeFullscreen()">
        <img id="modalImg" class="modal-content" src="" alt="Pełny ekran" onclick="event.stopPropagation()"> <!-- stopPropagation zapobiega zamknięciu przy kliknięciu w obrazek -->
        <button class="modal-close" onclick="closeFullscreen()">Zamknij</button>
    </div>

    <script>
        const TOTAL_CARDS = 84; 
        const board = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const confirmBtn = document.getElementById('confirmBtn');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        
        let selectedIds = new Set(); 

        // Generowanie talii
        const deck = Array.from({ length: TOTAL_CARDS }, (_, i) => ({
            id: i + 1,
            imageUrl: `https://picsum.photos/seed/dixit_game_${i + 1}/400/600`
        }));

        // --- LOSOWANIE ---
        function drawRandom(amount) {
            selectedIds.clear(); 
            const shuffled = [...deck].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, amount);
            selected.forEach(c => selectedIds.add(c.id));
            showSelectedCards();
            statusEl.innerText = `Wylosowano automatycznie: ${amount}.`;
        }

        // --- TRYB WYBORU (SIATKA) ---
        function showSelectionMode() {
            board.innerHTML = '';
            board.className = 'board selection-mode';
            
            deck.forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                if (selectedIds.has(card.id)) cardEl.classList.add('selected');

                cardEl.onclick = () => toggleCardSelection(card.id, cardEl);

                cardEl.innerHTML = `
                    <img src="${card.imageUrl}" loading="lazy" alt="Karta ${card.id}">
                    <div class="card-number">${card.id}</div>
                `;
                board.appendChild(cardEl);
            });

            statusEl.innerText = "Kliknij karty, aby zaznaczyć. Potem kliknij 'Pokaż wybrane'.";
            updateConfirmButton();
        }

        function toggleCardSelection(id, element) {
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
                element.classList.remove('selected');
            } else {
                selectedIds.add(id);
                element.classList.add('selected');
            }
            updateConfirmButton();
        }

        function updateConfirmButton() {
            const count = selectedIds.size;
            if (count > 0) {
                confirmBtn.style.display = 'block';
                confirmBtn.innerText = `✅ Pokaż wybrane (${count})`;
                statusEl.innerText = `Wybrano: ${count}`;
            } else {
                confirmBtn.style.display = 'none';
                statusEl.innerText = "Wybierz karty z listy.";
            }
        }

        // --- TRYB PREZENTACJI (DUŻE KARTY) ---
        function showSelectedCards() {
            const cardsToShow = deck.filter(card => selectedIds.has(card.id));
            
            board.className = 'board';
            board.innerHTML = '';
            confirmBtn.style.display = 'none';
            
            if (cardsToShow.length === 0) {
                board.innerHTML = '<div style="color:#aaa; width:100%; text-align:center;">Brak kart na stole.</div>';
                statusEl.innerText = "Stół jest pusty.";
                return;
            }

            statusEl.innerText = "Karty na stole. Kliknij 🔍 aby powiększyć.";

            cardsToShow.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card animate-pop';
                cardEl.style.animationDelay = `${index * 0.1}s`;

                // Przycisk powiększania (Lupka) - LEWA STRONA
                const zoomBtn = document.createElement('div');
                zoomBtn.className = 'action-btn zoom-btn';
                zoomBtn.innerText = '🔍';
                zoomBtn.title = 'Powiększ';
                zoomBtn.onclick = (e) => {
                    e.stopPropagation();
                    openFullscreen(card.imageUrl);
                };

                // Przycisk usuwania (Krzyżyk) - PRAWA STRONA
                const removeBtn = document.createElement('div');
                removeBtn.className = 'action-btn remove-btn';
                removeBtn.innerText = '×';
                removeBtn.title = 'Usuń tę kartę';
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeOneCard(card.id);
                };

                const img = document.createElement('img');
                img.src = card.imageUrl;
                
                const num = document.createElement('div');
                num.className = 'card-number';
                num.innerText = '#' + card.id;

                cardEl.appendChild(zoomBtn);   // Dodanie lupki
                cardEl.appendChild(removeBtn); // Dodanie krzyżyka
                cardEl.appendChild(img);
                cardEl.appendChild(num);
                
                board.appendChild(cardEl);
            });
        }

        function removeOneCard(id) {
            selectedIds.delete(id);
            showSelectedCards();
        }

        function resetBoard() {
            selectedIds.clear();
            board.className = 'board';
            board.innerHTML = '<div style="color:#aaa; width:100%; text-align:center; padding:20px;">Stół wyczyszczony.</div>';
            confirmBtn.style.display = 'none';
            statusEl.innerText = "Gotowy do nowej tury.";
        }

        // --- OBSŁUGA MODALA (PEŁNY EKRAN) ---
        function openFullscreen(url) {
            modalImg.src = url;
            modal.style.display = 'flex';
        }

        function closeFullscreen() {
            modal.style.display = 'none';
            modalImg.src = '';
        }

        // Zamknij modal klawiszem ESC
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape" && modal.style.display === 'flex') {
                closeFullscreen();
            }
        });
    </script>

</body>
